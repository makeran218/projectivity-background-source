<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top bar */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: #16213e;
    border-bottom: 1px solid #0f3460;
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 600; color: #e94560; }
  #status { font-size: 12px; color: #2ecc71; flex: 1; }
  .btn {
    padding: 6px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    background: #0f3460;
    color: #e0e0e0;
    transition: background 0.2s;
  }
  .btn:hover { background: #1a4a7a; }
  .btn-save { background: #e94560; color: #fff; }
  .btn-save:hover { background: #c73652; }

  /* Main layout */
  main { flex: 1; display: flex; min-height: 0; }

  /* Preview */
  #previewPane {
    flex: 1;
    position: relative;
    overflow: auto;
    background: #0d1117;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #previewBox { position: relative; }
  #preview { display: block; background: #000; }

  /* Element drag handles */
  .el-handle {
    position: absolute;
    border: 1px dashed rgba(233, 69, 96, 0.9);
    cursor: move;
  }
  .el-handle .tag {
    position: absolute;
    top: -16px;
    left: -1px;
    font-size: 10px;
    background: rgba(22, 33, 62, 0.95);
    color: #e94560;
    padding: 1px 5px;
    border-radius: 3px;
    white-space: nowrap;
    pointer-events: none;
  }
  .el-handle .rz {
    position: absolute;
    right: -6px;
    bottom: -6px;
    width: 12px;
    height: 12px;
    background: #e94560;
    border: 2px solid #fff;
    border-radius: 50%;
    cursor: nwse-resize;
  }

  /* Settings panel */
  #panel {
    width: 390px;
    background: #16213e;
    border-left: 1px solid #0f3460;
    overflow-y: auto;
    padding: 12px;
    flex-shrink: 0;
  }
  #panel::-webkit-scrollbar { width: 6px; }
  #panel::-webkit-scrollbar-track { background: #16213e; }
  #panel::-webkit-scrollbar-thumb { background: #0f3460; border-radius: 3px; }

  .group {
    margin-bottom: 14px;
    background: #1a1a2e;
    border-radius: 8px;
    padding: 10px 12px;
  }
  .group-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #e94560;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .row { display: flex; align-items: center; margin-bottom: 6px; }
  .row:last-child { margin-bottom: 0; }
  .row > label {
    width: 125px;
    font-size: 12px;
    color: #8899aa;
    flex-shrink: 0;
  }
  .row .ctl { flex: 1; min-width: 0; }

  input[type="number"], input[type="text"], textarea, select {
    width: 100%;
    padding: 4px 8px;
    background: #0f3460;
    border: 1px solid #1a4a7a;
    border-radius: 4px;
    color: #e0e0e0;
    font-size: 12px;
    outline: none;
    font-family: inherit;
  }
  input[type="number"]:focus, input[type="text"]:focus, textarea:focus, select:focus { border-color: #e94560; }
  input[type="range"] { width: 100%; accent-color: #e94560; }
  input[type="checkbox"] { accent-color: #e94560; width: 16px; height: 16px; }
  textarea { resize: vertical; min-height: 54px; }
  .hint { font-size: 11px; color: #66788a; margin-top: 8px; line-height: 1.45; }
  .file-row { display: flex; align-items: center; gap: 6px; }
  .file-row input[type="file"] { display: none; }
  .file-name {
    font-size: 11px;
    color: #2ecc71;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .el-cells { display: flex; gap: 6px; }
  .el-cells > div { flex: 1; min-width: 0; }
  .el-cells .cap { font-size: 10px; color: #66788a; margin-bottom: 2px; }
</style>
</head>
<body>

<header>
  <h1>Background Editor</h1>
  <span id="status"></span>
  <button class="btn" id="btnLoad">Reload</button>
  <button class="btn btn-save" id="btnSave">Save</button>
</header>

<main>
  <section id="previewPane">
    <div id="previewBox">
      <img id="preview" alt="">
    </div>
  </section>
  <aside id="panel"></aside>
</main>

<script>
"use strict";

// ============================================================
// Model
// ============================================================

// Element fields main.py reads (image_settings_elements.json)
const ELEMENTS = {
  label:        { label: "Label",        fields: ["x", "y"] },
  service_logo: { label: "Service logo", fields: ["x", "y"] },
  title_logo:   { label: "Title logo",   fields: ["x", "y", "w", "h"] },
  metadata:     { label: "Metadata",     fields: ["x", "y", "w"] },
  rating:       { label: "Rating",       fields: ["x", "y"] },
  overview:     { label: "Overview",     fields: ["x", "y", "w"] },
};

// Settings panel spec: [settings key, label, type, min, max]
const SETTING_GROUPS = [
  { title: "Canvas", fields: [
    ["canvas.width", "Width", "number", 100, 8000],
    ["canvas.height", "Height", "number", 100, 8000],
  ]},
  { title: "Gradient", fields: [
    ["gradient.end_x", "Fade end X", "number", 0, 8000],
    ["gradient.max_alpha", "Max alpha", "range", 0, 255],
  ]},
  { title: "Label", fields: [
    ["label.font_size", "Font size", "number", 10, 300],
  ]},
  { title: "Service logo", fields: [
    ["service_logo.height", "Height", "number", 10, 500],
  ]},
  { title: "Fallback title", fields: [
    ["fallback_title.max_font_size", "Max font size", "number", 20, 500],
    ["fallback_title.cjk_max_font_size", "CJK max font size", "number", 20, 500],
    ["fallback_title.min_font_size", "Min font size", "number", 10, 500],
    ["fallback_title.line_extra_spacing", "Line extra spacing", "number", 0, 100],
    ["fallback_title.bottom_padding", "Bottom padding", "number", 0, 500],
    ["fallback_title.shadow_offset_x", "Shadow X", "number", -50, 50],
    ["fallback_title.shadow_offset_y", "Shadow Y", "number", -50, 50],
  ]},
  { title: "Metadata", fields: [
    ["metadata.font_size", "Font size", "number", 10, 300],
    ["metadata.cert_padding_x", "Cert pad X", "number", 0, 100],
    ["metadata.cert_padding_y", "Cert pad Y", "number", 0, 100],
    ["metadata.cert_radius", "Cert radius", "number", 0, 50],
    ["metadata.cert_y_offset", "Cert Y offset", "number", -100, 100],
    ["metadata.text_y_offset", "Text Y offset", "number", -100, 100],
    ["metadata.shadow_offset_x", "Shadow X", "number", -50, 50],
    ["metadata.shadow_offset_y", "Shadow Y", "number", -50, 50],
    ["metadata.dot_spacing", "Dot spacing", "number", 0, 200],
    ["metadata.cert_dot_extra", "Cert dot extra", "number", 0, 200],
    ["metadata.dot_width_extra", "Dot width extra", "number", 0, 200],
  ]},
  { title: "Rating", fields: [
    ["rating.star_cx_offset", "Star CX offset", "number", -100, 500],
    ["rating.star_cy_offset", "Star CY offset", "number", -100, 500],
    ["rating.star_y_offset", "Star Y offset", "number", -100, 500],
    ["rating.outer_radius", "Outer radius", "number", 5, 200],
    ["rating.inner_radius", "Inner radius", "number", 1, 200],
    ["rating.text_x_offset", "Text X offset", "number", -100, 500],
    ["rating.font_size", "Font size", "number", 10, 300],
  ]},
  { title: "Overview", fields: [
    ["overview.font_size", "Font size", "number", 10, 300],
    ["overview.max_lines", "Max lines", "number", 0, 10],
    ["overview.line_spacing", "Line spacing", "number", 0, 300],
    ["overview.shadow_offset_x", "Shadow X", "number", -50, 50],
    ["overview.shadow_offset_y", "Shadow Y", "number", -50, 50],
  ]},
  { title: "Output", fields: [
    ["output.quality", "JPEG quality", "range", 1, 100],
    ["output.use_vignette", "Use vignette", "checkbox"],
  ]},
];

const SAMPLE_TEXT_FIELDS = [
  ["label", "Label"],
  ["title", "Title (text mode)"],
  ["genres", "Genres"],
  ["year", "Year"],
  ["extra", "Runtime / seasons"],
  ["certification", "Certification"],
];

const state = { settings: {}, elements: {}, sample: {} };
let serviceLogos = [];
let scale = 1;
let renderToken = 0;
let renderTimer = null;

// ============================================================
// Helpers
// ============================================================

function $(id) { return document.getElementById(id); }
function setStatus(t) { $("status").textContent = t; }

function getNested(obj, key) {
  return key.split(".").reduce((o, k) => o?.[k], obj);
}
function setNested(obj, key, val) {
  const p = key.split(".");
  let t = obj;
  for (let i = 0; i < p.length - 1; i++) t = t[p[i]];
  t[p[p.length - 1]] = val;
}

function api(path, body) {
  return fetch(path, body
    ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
    : {}
  ).then(async r => {
    const ct = r.headers.get("content-type") || "";
    if (ct.includes("json")) {
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || String(r.status));
      return j;
    }
    if (!r.ok) throw new Error(String(r.status));
    return r;
  });
}

// ============================================================
// Preview: fit + drag handles
// ============================================================

// Display-only box extent for elements that have no saved w/h
function displayExtent(key) {
  const s = state.settings;
  const el = state.elements[key] || {};
  switch (key) {
    case "label":        return { w: 420, h: Math.round((s.label?.font_size || 42) * 1.3) };
    case "service_logo": return { w: 460, h: s.service_logo?.height || 75 };
    case "title_logo":   return { w: el.w ?? 1350, h: el.h ?? 420 };
    case "metadata":     return { w: el.w ?? 1550, h: Math.round((s.metadata?.font_size || 48) * 1.3) };
    case "rating":       return { w: 230, h: 90 };
    case "overview":     return { w: el.w ?? 1550, h: (s.overview?.line_spacing || 62) * (s.overview?.max_lines || 3) };
  }
}

function fitPreview() {
  const pane = $("previewPane");
  const img = $("preview");
  const cw = state.settings.canvas?.width || 3840;
  const ch = state.settings.canvas?.height || 2160;
  scale = Math.min((pane.clientWidth - 40) / cw, (pane.clientHeight - 40) / ch);
  if (!(scale > 0)) scale = 0.05;
  img.style.width = Math.floor(cw * scale) + "px";
  img.style.height = Math.floor(ch * scale) + "px";
  drawHandles();
}

function drawHandles() {
  const box = $("previewBox");
  box.querySelectorAll(".el-handle").forEach(h => h.remove());
  for (const key of Object.keys(ELEMENTS)) {
    const el = state.elements[key] || {};
    const ext = displayExtent(key);
    const d = document.createElement("div");
    d.className = "el-handle";
    d.dataset.key = key;
    d.style.left = (el.x || 0) * scale + "px";
    d.style.top = (el.y || 0) * scale + "px";
    d.style.width = ext.w * scale + "px";
    d.style.height = ext.h * scale + "px";
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = ELEMENTS[key].label;
    d.appendChild(tag);
    if (ELEMENTS[key].fields.includes("w")) {
      const rz = document.createElement("span");
      rz.className = "rz";
      d.appendChild(rz);
    }
    box.appendChild(d);
  }
}

function moveHandle(key) {
  const d = $("previewBox").querySelector(`.el-handle[data-key="${key}"]`);
  if (!d) return;
  const el = state.elements[key] || {};
  const ext = displayExtent(key);
  d.style.left = (el.x || 0) * scale + "px";
  d.style.top = (el.y || 0) * scale + "px";
  d.style.width = ext.w * scale + "px";
  d.style.height = ext.h * scale + "px";
}

function syncElementInputs(key) {
  const el = state.elements[key] || {};
  for (const f of ELEMENTS[key].fields) {
    const inp = document.querySelector(`.el-input[data-key="${key}"][data-f="${f}"]`);
    if (inp && document.activeElement !== inp) inp.value = el[f] ?? "";
  }
}

// Drag / resize (delegated on the preview box)
let drag = null;

$("previewBox").addEventListener("mousedown", e => {
  const h = e.target.closest(".el-handle");
  if (!h) return;
  e.preventDefault();
  const key = h.dataset.key;
  const el = state.elements[key] || {};
  drag = {
    key,
    mode: e.target.classList.contains("rz") ? "resize" : "move",
    sx: e.clientX, sy: e.clientY,
    ox: el.x || 0, oy: el.y || 0,
    ow: el.w ?? displayExtent(key).w,
    oh: el.h ?? displayExtent(key).h,
  };
});

window.addEventListener("mousemove", e => {
  if (!drag) return;
  const dx = (e.clientX - drag.sx) / scale;
  const dy = (e.clientY - drag.sy) / scale;
  const el = state.elements[drag.key] || (state.elements[drag.key] = {});
  if (drag.mode === "move") {
    el.x = Math.round(drag.ox + dx);
    el.y = Math.round(drag.oy + dy);
  } else {
    if (ELEMENTS[drag.key].fields.includes("w")) el.w = Math.max(50, Math.round(drag.ow + dx));
    if (ELEMENTS[drag.key].fields.includes("h")) el.h = Math.max(20, Math.round(drag.oh + dy));
  }
  moveHandle(drag.key);
  syncElementInputs(drag.key);
});

window.addEventListener("mouseup", () => {
  if (!drag) return;
  drag = null;
  scheduleRender();
});

// ============================================================
// Live render (server renders with the real main.py code)
// ============================================================

function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(fireRender, 700);
}

async function fireRender() {
  const token = ++renderToken;
  const img = $("preview");
  img.style.opacity = "0.35";
  setStatus("rendering…");
  try {
    const res = await api("/api/render", state);
    const url = URL.createObjectURL(await res.blob());
    if (token !== renderToken) { URL.revokeObjectURL(url); return; }
    if (img.src.startsWith("blob:")) URL.revokeObjectURL(img.src);
    img.src = url;
    img.style.opacity = "1";
    setStatus("preview is what main.py will output");
  } catch (err) {
    img.style.opacity = "1";
    setStatus("render error: " + err.message);
  }
}

// ============================================================
// Settings panel
// ============================================================

function makeGroup(title, build, hint) {
  const g = document.createElement("div");
  g.className = "group";
  const t = document.createElement("div");
  t.className = "group-title";
  t.textContent = title;
  g.appendChild(t);
  build(g);
  if (hint) {
    const h = document.createElement("div");
    h.className = "hint";
    h.textContent = hint;
    g.appendChild(h);
  }
  return g;
}

function makeRow(parent, labelText, build) {
  const row = document.createElement("div");
  row.className = "row";
  const lab = document.createElement("label");
  lab.textContent = labelText;
  row.appendChild(lab);
  const ctl = document.createElement("div");
  ctl.className = "ctl";
  build(ctl);
  row.appendChild(ctl);
  parent.appendChild(row);
  return ctl;
}

function numInput(value, min, max, oninput, step) {
  const i = document.createElement("input");
  i.type = "number";
  if (min !== undefined) i.min = min;
  if (max !== undefined) i.max = max;
  if (step !== undefined) i.step = step;
  i.value = value ?? "";
  i.addEventListener("change", () => oninput(parseFloat(i.value)));
  return i;
}

function rangeInput(value, min, max, oninput) {
  const i = document.createElement("input");
  i.type = "range";
  i.min = min; i.max = max; i.step = 1;
  i.value = value ?? min;
  const lab = document.createElement("span");
  lab.style.cssText = "font-size:11px;color:#e94560;margin-left:6px;min-width:24px;text-align:right;";
  lab.textContent = i.value;
  i.addEventListener("input", () => { lab.textContent = i.value; oninput(parseInt(i.value)); });
  const wrap = document.createElement("span");
  wrap.style.display = "flex";
  wrap.style.alignItems = "center";
  wrap.appendChild(i);
  wrap.appendChild(lab);
  return wrap;
}

function checkInput(value, oninput) {
  const i = document.createElement("input");
  i.type = "checkbox";
  i.checked = !!value;
  i.addEventListener("change", () => oninput(i.checked));
  return i;
}

function textInput(value, oninput) {
  const i = document.createElement("input");
  i.type = "text";
  i.value = value ?? "";
  i.addEventListener("change", () => oninput(i.value));
  return i;
}

function fileButton(label, target) {
  const wrap = document.createElement("div");
  wrap.className = "file-row";
  const btn = document.createElement("button");
  btn.className = "btn";
  btn.textContent = label;
  const fi = document.createElement("input");
  fi.type = "file";
  fi.accept = ".png,.jpg,.jpeg,.webp";
  btn.addEventListener("click", () => fi.click());
  fi.addEventListener("change", () => { if (fi.files[0]) uploadFile(fi.files[0], target); });
  wrap.appendChild(btn);
  wrap.appendChild(fi);
  return wrap;
}

async function uploadFile(file, target) {
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      setStatus("uploading…");
      const j = await api("/api/upload", {
        target,
        filename: file.name,
        data: reader.result.split(",")[1],
      });
      if (target === "title_logo") state.sample.title_logo = j.filename;
      else state.sample.bg = "bg.jpg";
      buildPanel();
      setStatus("uploaded " + file.name);
      scheduleRender();
    } catch (e) {
      setStatus("upload error: " + e.message);
    }
  };
  reader.readAsDataURL(file);
}

function buildPanel() {
  const panel = $("panel");
  panel.innerHTML = "";

  // ---- Sample content (preview only) ----
  panel.appendChild(makeGroup("Sample content", g => {
    makeRow(g, "Background", c => {
      const wrap = fileButton("Upload bg", "bg");
      const name = document.createElement("span");
      name.className = "file-name";
      name.textContent = state.sample.bg || "";
      wrap.appendChild(name);
      c.appendChild(wrap);
    });
    for (const [key, label] of SAMPLE_TEXT_FIELDS) {
      makeRow(g, label, c => c.appendChild(textInput(state.sample[key], v => {
        state.sample[key] = v;
        scheduleRender();
      })));
    }
    makeRow(g, "Service logo", c => {
      const sel = document.createElement("select");
      serviceLogos.forEach(fn => {
        const o = document.createElement("option");
        o.value = fn;
        o.textContent = fn;
        if (fn === state.sample.service) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener("change", () => { state.sample.service = sel.value; scheduleRender(); });
      c.appendChild(sel);
    });
    makeRow(g, "Title display", c => {
      const sel = document.createElement("select");
      [["logo", "Logo image"], ["text", "Text (no logo)"]].forEach(([val, label]) => {
        const o = document.createElement("option");
        o.value = val;
        o.textContent = label;
        if ((state.sample.title_source || "logo") === val) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener("change", () => { state.sample.title_source = sel.value; scheduleRender(); });
      c.appendChild(sel);
    });
    makeRow(g, "Title logo", c => {
      const wrap = fileButton("Upload logo", "title_logo");
      const name = document.createElement("span");
      name.className = "file-name";
      name.textContent = state.sample.title_logo || "";
      wrap.appendChild(name);
      c.appendChild(wrap);
    });
    makeRow(g, "Rating (0–10)", c => c.appendChild(numInput(state.sample.rating, 0, 10, v => {
      state.sample.rating = isNaN(v) ? 0 : v;
      scheduleRender();
    }, 0.1)));
    makeRow(g, "Overview", c => {
      const t = document.createElement("textarea");
      t.value = state.sample.overview || "";
      t.addEventListener("change", () => { state.sample.overview = t.value; scheduleRender(); });
      c.appendChild(t);
    });
  }, "Preview-only dummy content. main.py fills these from TMDB at runtime."));

  // ---- Element positions ----
  panel.appendChild(makeGroup("Element positions", g => {
    for (const key of Object.keys(ELEMENTS)) {
      const el = state.elements[key] || {};
      const row = document.createElement("div");
      row.className = "row";
      row.style.alignItems = "flex-start";
      const lab = document.createElement("label");
      lab.style.paddingTop = "14px";
      lab.textContent = ELEMENTS[key].label;
      row.appendChild(lab);
      const ctl = document.createElement("div");
      ctl.className = "ctl";
      const cells = document.createElement("div");
      cells.className = "el-cells";
      for (const f of ELEMENTS[key].fields) {
        const cell = document.createElement("div");
        const cap = document.createElement("div");
        cap.className = "cap";
        cap.textContent = f.toUpperCase();
        const i = document.createElement("input");
        i.type = "number";
        i.className = "el-input";
        i.dataset.key = key;
        i.dataset.f = f;
        i.value = el[f] ?? "";
        i.addEventListener("change", () => {
          el[f] = parseInt(i.value) || 0;
          drawHandles();
          scheduleRender();
        });
        cell.appendChild(cap);
        cell.appendChild(i);
        cells.appendChild(cell);
      }
      ctl.appendChild(cells);
      row.appendChild(ctl);
      g.appendChild(row);
    }
  }, "Drag the boxes on the preview or type values. W/H set the max size (title logo) or max width (metadata, overview) used by main.py."));

  // ---- Settings (image_settings.json) ----
  for (const group of SETTING_GROUPS) {
    panel.appendChild(makeGroup(group.title, g => {
      for (const [key, label, type, min, max] of group.fields) {
        makeRow(g, label, c => {
          if (type === "number") {
            c.appendChild(numInput(getNested(state.settings, key), min, max, v => {
              setNested(state.settings, key, isNaN(v) ? 0 : v);
              if (key === "canvas.width" || key === "canvas.height") fitPreview();
              else drawHandles();
              scheduleRender();
            }));
          } else if (type === "range") {
            c.appendChild(rangeInput(getNested(state.settings, key), min, max, v => {
              setNested(state.settings, key, v);
              drawHandles();
              scheduleRender();
            }));
          } else if (type === "checkbox") {
            c.appendChild(checkInput(getNested(state.settings, key), v => {
              setNested(state.settings, key, v);
              drawHandles();
              scheduleRender();
            }));
          }
        });
      }
    }));
  }
}

// ============================================================
// Load / Save
// ============================================================

async function load() {
  try {
    setStatus("loading…");
    const j = await api("/api/config");
    state.settings = j.settings;
    state.elements = j.elements;
    state.sample = j.sample;
    serviceLogos = j.service_logos;
    buildPanel();
    fitPreview();
    fireRender();
  } catch (e) {
    setStatus("load error: " + e.message);
  }
}

async function save() {
  try {
    setStatus("saving…");
    await api("/api/save", state);
    setStatus("saved: image_settings.json, image_settings_elements.json, sample/sample_data.json");
  } catch (e) {
    setStatus("save error: " + e.message);
  }
}

$("btnSave").addEventListener("click", save);
$("btnLoad").addEventListener("click", load);
window.addEventListener("resize", () => fitPreview());
load();
</script>
</body>
</html>
